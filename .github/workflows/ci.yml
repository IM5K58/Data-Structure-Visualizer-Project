name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes the run still in flight for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The two halves have separate lockfiles and separate dependency trees, so
  # they install and run independently. Splitting them also names the failure:
  # a red `server` job is never a frontend regression.
  web:
    name: web — lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # `eslint .` reaches server/src as well, so this one step is the whole
      # repo's lint. The server job deliberately does not repeat it.
      - name: Lint
        run: npm run lint

      # Both project tsconfigs set noEmit, so `tsc -b` is a pure typecheck.
      # Run it before the tests: it fails in seconds, the suite takes ~20s.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  server:
    name: server — types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      # `tsc` here emits, so it typechecks and proves the dist build works.
      - name: Typecheck and build
        run: npm run build

      # These are pure unit tests over recorded GDB MI output — no g++, no gdb,
      # no network. Keep them that way, or this job needs a toolchain.
      - name: Test
        run: npm test
